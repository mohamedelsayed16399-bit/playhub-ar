<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f1226">
<title>ملعب – منصة الألعاب</title>
<style>
:root{--bg:#0f1226;--card:#1a1f3d;--card2:#232950;--ac:#ffb020;--ac2:#7c5cff;--tx:#f2f4ff;--mu:#9aa3d6;--ok:#2ecc71;--bad:#ff5c6c}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,"Segoe UI",Tahoma,sans-serif;padding-bottom:78px}
header{position:sticky;top:0;z-index:20;background:linear-gradient(135deg,#171b3a,#2a1f5e);padding:10px 14px;display:flex;align-items:center;gap:10px;border-bottom:1px solid #ffffff14}
header h1{font-size:20px;margin:0;flex:1}header h1 span{color:var(--ac)}
.badge{font-size:11px;padding:3px 8px;border-radius:99px;background:#ffffff18}
.badge.on{background:#2ecc7133;color:var(--ok)}
nav{position:fixed;bottom:0;left:0;right:0;z-index:30;display:flex;background:#12162f;border-top:1px solid #ffffff18;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:none;border:0;color:var(--mu);padding:9px 2px 8px;font-size:11px;cursor:pointer;position:relative}
nav button b{display:block;font-size:20px;font-weight:400}
nav button.on{color:var(--ac)}
nav .dot{position:absolute;top:4px;left:50%;margin-left:6px;background:var(--bad);color:#fff;border-radius:99px;font-size:10px;min-width:16px;padding:0 4px}
main{max-width:900px;margin:0 auto;padding:12px}
h2{font-size:17px;margin:18px 0 8px}
.row{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.card{background:var(--card);border-radius:16px;overflow:hidden;border:1px solid #ffffff0d;cursor:pointer;transition:transform .15s}
.card:active{transform:scale(.98)}
.row .card{min-width:210px;max-width:210px}
.thumb{height:92px;display:flex;align-items:center;justify-content:center;font-size:44px}
.cb{padding:10px 12px}
.cb h3{margin:0 0 4px;font-size:15px}
.meta{font-size:12px;color:var(--mu);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.star{color:var(--ac)}
.chips{display:flex;gap:6px;overflow-x:auto;padding:6px 0;scrollbar-width:none}
.chip{white-space:nowrap;padding:6px 13px;border-radius:99px;background:var(--card);color:var(--mu);border:0;font-size:13px;cursor:pointer}
.chip.on{background:var(--ac);color:#1b1500;font-weight:700}
input,textarea,select{width:100%;background:var(--card);border:1px solid #ffffff22;color:var(--tx);border-radius:12px;padding:11px;font:inherit;margin:4px 0}
textarea{min-height:90px}
.btn{background:var(--ac2);color:#fff;border:0;border-radius:12px;padding:10px 16px;font:inherit;font-weight:700;cursor:pointer}
.btn.gold{background:var(--ac);color:#1b1500}.btn.ghost{background:var(--card2);color:var(--tx)}.btn.sm{padding:6px 11px;font-size:13px}
.btn:disabled{opacity:.5}
.box{background:var(--card);border-radius:16px;padding:14px;margin:10px 0}
.frame{width:100%;height:62vh;min-height:380px;border:0;border-radius:14px;background:#000}
.stars button{background:none;border:0;font-size:30px;color:#555;cursor:pointer;padding:0 2px}
.stars button.on{color:var(--ac)}
.cm{padding:9px 0;border-bottom:1px solid #ffffff10}.cm small{color:var(--mu)}
.lb{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid #ffffff10;align-items:center}
.lb .n{width:26px;text-align:center;font-weight:800;color:var(--ac)}
.av{width:38px;height:38px;border-radius:50%;background:var(--card2);display:inline-flex;align-items:center;justify-content:center;font-size:21px}
.toast{position:fixed;top:64px;left:50%;transform:translateX(-50%);background:#000c;padding:10px 18px;border-radius:12px;z-index:99;font-size:14px}
.back{background:none;border:0;color:var(--ac);font-size:15px;padding:4px 0;cursor:pointer}
.empty{color:var(--mu);text-align:center;padding:26px 0}
.avs{display:flex;flex-wrap:wrap;gap:8px}.avs button{font-size:24px;background:var(--card2);border:2px solid transparent;border-radius:12px;padding:4px 8px;cursor:pointer}.avs button.on{border-color:var(--ac)}
</style>
</head>
<body>
<header><h1>🎮 <span>ملعب</span></h1><span class="badge" id="mode"></span><button class="btn sm ghost" id="meBtn"></button></header>
<main id="app"></main>
<nav id="nav"></nav>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
